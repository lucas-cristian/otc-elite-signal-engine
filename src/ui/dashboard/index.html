<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OTC Elite Dashboard</title>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; margin: 24px; max-width: 1100px; }
    h1 { font-family: system-ui, sans-serif; font-size: 34px; margin-bottom: 8px; }
    .subtitle { font-family: system-ui, sans-serif; font-size: 16px; }
    pre { white-space: pre-wrap; line-height: 1.35; padding: 16px 0; }
    button { font: inherit; padding: 8px 12px; margin-right: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>OTC Elite Signal Engine</h1>
    <p class="subtitle">Reference-feed analytics. Not realized P&amp;L.</p>
    <pre id="analytics"></pre>
    <button id="refresh">Refresh</button>
    <button id="export">Export scientific dataset</button>
    <button id="start-phase4">Start / Freeze Phase 4</button>
    <button id="import-phase4">Import Phase 4 dataset</button>
    <button id="export-phase4-attestation">Export Phase 4 start attestation</button>
    <button id="export-phase4">Export Phase 4 evidence</button>
    <input id="phase4-file" type="file" accept="application/json,.json" hidden>
  </main>
  <script type="module" src="./dashboard.js"></script>
</body>
</html>
